<svg width="1000" height="280" viewBox="0 0 1000 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b12"/>
      <stop offset="45%" stop-color="#0d1826"/>
      <stop offset="100%" stop-color="#081119"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5B9BFF"/>
      <stop offset="55%" stop-color="#20BEFF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>

  <rect width="1000" height="280" fill="url(#bg)"/>

  <!-- deep background network (dim, dense, static feel) -->
  <g stroke="#1c3a5e" stroke-opacity="0.5" stroke-width="0.8">
    <line x1="0" y1="40" x2="90" y2="90"/><line x1="90" y1="90" x2="60" y2="160"/>
    <line x1="90" y1="90" x2="180" y2="70"/><line x1="180" y1="70" x2="230" y2="140"/>
    <line x1="60" y1="160" x2="150" y2="200"/><line x1="150" y1="200" x2="230" y2="140"/>
    <line x1="0" y1="230" x2="70" y2="200"/><line x1="820" y1="60" x2="900" y2="30"/>
    <line x1="900" y1="30" x2="970" y2="80"/><line x1="900" y1="30" x2="940" y2="120"/>
    <line x1="940" y1="120" x2="1000" y2="160"/><line x1="820" y1="60" x2="790" y2="140"/>
    <line x1="790" y1="140" x2="850" y2="200"/><line x1="850" y1="200" x2="940" y2="120"/>
    <line x1="850" y1="200" x2="920" y2="250"/>
  </g>
  <g fill="#2a4d75" fill-opacity="0.7">
    <circle cx="90" cy="90" r="2.4"/><circle cx="60" cy="160" r="2"/>
    <circle cx="180" cy="70" r="2.4"/><circle cx="230" cy="140" r="2.6"/>
    <circle cx="150" cy="200" r="2"/><circle cx="70" cy="200" r="2"/>
    <circle cx="900" cy="30" r="2.4"/><circle cx="970" cy="80" r="2"/>
    <circle cx="940" cy="120" r="2.6"/><circle cx="1000" cy="160" r="2"/>
    <circle cx="820" cy="60" r="2.2"/><circle cx="790" cy="140" r="2"/>
    <circle cx="850" cy="200" r="2.4"/><circle cx="920" cy="250" r="2"/>
  </g>

  <!-- foreground accent network (brighter, catches eye at edges) -->
  <g stroke="#3B82F6" stroke-opacity="0.35" stroke-width="1.1">
    <line x1="30" y1="45" x2="120" y2="30"/>
    <line x1="120" y1="30" x2="170" y2="95"/>
    <line x1="30" y1="45" x2="55" y2="115"/>
    <line x1="880" y1="235" x2="945" y2="200"/>
    <line x1="945" y1="200" x2="920" y2="140"/>
    <line x1="880" y1="235" x2="960" y2="255"/>
  </g>
  <g fill="#5B9BFF">
    <circle cx="120" cy="30" r="2.8"/><circle cx="170" cy="95" r="2.4"/>
    <circle cx="55" cy="115" r="2.4"/><circle cx="945" cy="200" r="2.8"/>
    <circle cx="920" cy="140" r="2.4"/><circle cx="960" cy="255" r="2.4"/>
  </g>

  <!-- faint binary texture, corners only -->
  <g font-family="'Fira Code', Consolas, monospace" font-size="10.5" fill="#1c3654" fill-opacity="0.8" letter-spacing="1">
    <text x="18" y="255">01001101 01001100</text>
    <text x="782" y="22">01000001 01001001</text>
  </g>

  <!-- title -->
  <text x="500" y="128" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-weight="700"
        font-size="44" fill="url(#titleGrad)" filter="url(#glow)" letter-spacing="3.5">
    MUHAMMAD HUZAIFA KHAN
  </text>

  <text x="500" y="168" text-anchor="middle" font-family="'Fira Code', Consolas, monospace"
        font-size="17.5" fill="#a8c0dc" letter-spacing="1.2">
    Building Intelligent Systems, One Project at a Time
  </text>

  <line x1="290" y1="188" x2="710" y2="188" stroke="#20BEFF" stroke-opacity="0.5" stroke-width="1"/>
  <circle cx="500" cy="188" r="2.5" fill="#20BEFF"/>

  <text x="500" y="214" text-anchor="middle" font-family="'Fira Code', Consolas, monospace"
        font-size="13" fill="#5f7fa3" letter-spacing="0.8">
    Computer Science Student  ·  Aspiring Machine Learning Engineer
  </text>

  <rect width="1000" height="280" fill="url(#vignette)"/>
  <rect x="0.5" y="0.5" width="999" height="279" fill="none" stroke="#1e3a5f" stroke-opacity="0.6" stroke-width="1"/>
</svg>
